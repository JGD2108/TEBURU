services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teburu
      POSTGRES_USER: teburu
      POSTGRES_PASSWORD: teburu_local_only
    ports:
      - "54322:5432"
    volumes:
      - teburu_postgres:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teburu -d teburu"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://teburu:teburu_local_only@postgres:5432/teburu
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  teburu_postgres:
